[project]
name = "congressional-sales"
version = "0.1.0"
description = "Pre-registered study: do congressional sales carry more information than purchases?"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.9",
    "duckdb>=1.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "pyarrow>=25.0.0",
    "tabulate>=0.10.0",
    "xlrd>=2.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/congressional_sales"]
